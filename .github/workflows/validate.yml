name: Validate Prezensa Management
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/m365-scorecard-persistence]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm install
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-placeholder-secret-not-for-production
          AZURE_AD_CLIENT_ID: ci-placeholder
          AZURE_AD_CLIENT_SECRET: ci-placeholder
          AZURE_AD_TENANT_ID: 00000000-0000-0000-0000-000000000000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prezensa
