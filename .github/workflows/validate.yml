name: Validate Prezensa Management
on:
  pull_request:
    branches: [main]
  push:
    branches: [remove-authentication]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm install
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prezensa
